<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Badges des agents</title>
<style>
  :root { --deep: #2a0508; --red: #e8142b; --black: #111111; --yellow: #ffe14d; --gold: #ffd23f; --cream: #fff1d6; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #ddd; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; color: var(--black); }
  .bar { background: var(--black); color: var(--cream); padding: 10px 16px; font-size: 14px; line-height: 1.5; }
  .bar button { font: inherit; padding: 4px 12px; margin-left: 8px; cursor: pointer; }
  .sheet { width: 210mm; margin: 10px auto; padding: 10mm 8mm; background: #fff; display: grid; grid-template-columns: repeat(2, 92mm); grid-auto-rows: 62mm; gap: 4mm 6mm; justify-content: center; }

  .badge { position: relative; width: 92mm; height: 62mm; border-radius: 4mm; overflow: hidden; background: var(--cream); border: 0.8mm solid var(--black); display: flex; flex-direction: column; }
  .head { background: var(--red); color: #fff; height: 13mm; display: flex; align-items: center; justify-content: space-between; padding: 0 4mm 0 12mm; border-bottom: 0.8mm solid var(--black); }
  .head .org { font-weight: bold; letter-spacing: .22em; text-transform: uppercase; font-size: 3.4mm; }
  .head .lvl { background: var(--black); color: var(--yellow); font-size: 2.6mm; font-weight: bold; letter-spacing: .15em; text-transform: uppercase; padding: .8mm 2.2mm; border-radius: 99mm; }
  .hole { position: absolute; top: 3.2mm; left: 4mm; width: 6mm; height: 6mm; border-radius: 50%; background: #fff; border: 0.6mm solid var(--black); }
  .body { flex: 1; display: flex; gap: 3.5mm; padding: 3mm 4mm 0; }
  .photo { width: 27mm; height: 33mm; flex: none; border: 0.7mm dashed var(--black); background: #fff; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 2.6mm; color: #777; overflow: hidden; cursor: pointer; }
  .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .info { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .lab { font-size: 2.2mm; text-transform: uppercase; letter-spacing: .12em; color: var(--red); font-weight: bold; margin-top: 1.2mm; }
  .val { font-size: 4.6mm; font-weight: bold; border-bottom: 0.3mm solid var(--black); min-height: 6mm; outline: none; line-height: 1.3; }
  .spec { margin-top: auto; margin-bottom: 2.5mm; display: flex; align-items: center; gap: 2.5mm; background: var(--black); color: var(--cream); border-radius: 2.5mm; padding: 1.6mm 2.4mm; }
  .spec svg { width: 9mm; height: 9mm; flex: none; }
  .spec .t { font-size: 4mm; font-weight: bold; color: var(--yellow); text-transform: uppercase; letter-spacing: .08em; line-height: 1.1; }
  .spec .d { font-size: 2.5mm; line-height: 1.25; margin-top: .5mm; }
  .foot { height: 5mm; background: repeating-linear-gradient(135deg, var(--black) 0 3mm, var(--yellow) 3mm 6mm); }

  @media print {
    @page { size: A4; margin: 0; }
    body { background: #fff; }
    .bar { display: none; }
    .sheet { margin: 0; box-shadow: none; page-break-after: always; }
    .photo { border-style: dashed; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>

<div class="bar">
  Modèles de badges, à imprimer en A4 (échelle 100 %, couleurs activées). Cliquer sur le cadre photo pour ajouter une image, cliquer sur un nom pour le modifier.
  <button onclick="addCopy()">Ajouter un badge vierge</button>
  <button onclick="window.print()">Imprimer</button>
</div>

<div class="sheet" id="sheet"></div>

<script>
  var ICON = {
    key: '<circle cx="12" cy="12" r="7" fill="none" stroke="#ffd23f" stroke-width="3.5"/><path d="M18 18 L40 40 M32 32 L32 40 M38 38 L38 44" stroke="#ffd23f" stroke-width="4" stroke-linecap="round" fill="none"/>',
    lens: '<circle cx="19" cy="19" r="13" fill="none" stroke="#ffd23f" stroke-width="4"/><path d="M29 29 L43 43" stroke="#ffd23f" stroke-width="6" stroke-linecap="round"/>',
    compass: '<circle cx="24" cy="24" r="18" fill="none" stroke="#ffd23f" stroke-width="3.5"/><polygon points="24,9 29,24 24,39 19,24" fill="#e8142b"/><polygon points="24,9 29,24 19,24" fill="#ffd23f"/>',
    bolt: '<polygon points="28,3 10,27 22,27 18,45 38,19 25,19" fill="#ffd23f"/>',
    eye: '<path d="M3 24 Q24 4 45 24 Q24 44 3 24 Z" fill="none" stroke="#ffd23f" stroke-width="3.5"/><circle cx="24" cy="24" r="7" fill="#e8142b"/><circle cx="24" cy="24" r="3" fill="#ffd23f"/>',
    voice: '<path d="M6 8 H42 V32 H22 L12 42 V32 H6 Z" fill="none" stroke="#ffd23f" stroke-width="3.5" stroke-linejoin="round"/><path d="M15 17 H33 M15 24 H27" stroke="#ffd23f" stroke-width="3" stroke-linecap="round"/>'
  };

  var SPECS = [
    { name: "Décodeur", icon: "key", text: "Déchiffre les codes et les messages secrets." },
    { name: "Éclaireur", icon: "lens", text: "Repère l'invisible et retrouve les indices cachés." },
    { name: "Stratège", icon: "compass", text: "Dresse le plan et coordonne l'équipe." },
    { name: "Acrobate", icon: "bolt", text: "Rapide et précis, à l'aise dans l'action." },
    { name: "Mémoire", icon: "eye", text: "N'oublie aucun détail, aucun indice." },
    { name: "Voix", icon: "voice", text: "Chante, mime et parle toutes les langues du temps." }
  ];

  var sheet = document.getElementById("sheet");

  function makeBadge(spec, n) {
    var b = document.createElement("div");
    b.className = "badge";
    var svg = spec ? '<svg viewBox="0 0 48 48" aria-hidden="true">' + ICON[spec.icon] + '</svg>' : "";
    b.innerHTML =
      '<div class="head"><span class="org">Agence Chronos</span><span class="lvl">Agent</span></div>' +
      '<div class="hole"></div>' +
      '<div class="body">' +
        '<label class="photo"><span>Photo<br>à coller</span><input type="file" accept="image/*" hidden></label>' +
        '<div class="info">' +
          '<div class="lab">Prénom</div><div class="val" contenteditable="true" spellcheck="false">&nbsp;</div>' +
          '<div class="lab">Nom de code</div><div class="val" contenteditable="true" spellcheck="false">&nbsp;</div>' +
          '<div class="spec">' + svg +
            '<div><div class="t">' + (spec ? spec.name : "Spécialité") + '</div><div class="d">' + (spec ? spec.text : "") + '</div></div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="foot"></div>';
    var input = b.querySelector("input");
    input.addEventListener("change", function () {
      var f = input.files && input.files[0];
      if (!f) return;
      var r = new FileReader();
      r.onload = function () { b.querySelector(".photo").innerHTML = '<img alt="">'; b.querySelector(".photo img").src = r.result; };
      r.readAsDataURL(f);
    });
    return b;
  }

  for (var i = 0; i < SPECS.length; i++) sheet.appendChild(makeBadge(SPECS[i], i));
  function addCopy() { sheet.appendChild(makeBadge(null, 0)); }
</script>
</body>
</html>
