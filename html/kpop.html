<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concert des chasseurs de démons</title>
<style>
  :root { --deep: #2a0508; --crimson: #9c1020; --black: #111111; --yellow: #ffe14d; --cream: #fff1d6; --muted: #ffd6d6; --red: #e8142b; --gold: #ffd23f; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: linear-gradient(135deg, var(--deep) 0%, var(--crimson) 55%, #d4182b 100%); color: #fff; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; overflow: hidden; }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 5; background: repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 4px); }

  main { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; padding: 3vh 4vw 4.5vh; gap: 2vh; }
  .org { background: var(--black); color: var(--yellow); font-weight: bold; letter-spacing: .25em; text-transform: uppercase; font-size: clamp(14px, 2.2vh, 28px); padding: .6vh 1.6vw; border-radius: 999px; box-shadow: 0 0 20px rgba(255,210,63,.6); }
  h1 { margin: 0; font-size: clamp(34px, 7vh, 90px); line-height: 1.05; text-shadow: 4px 4px 0 var(--black); text-align: center; }
  .sub { margin: 0; font-size: clamp(18px, 3vh, 38px); color: var(--muted); text-align: center; }

  .letters { display: flex; gap: 1vw; justify-content: center; margin: 1vh 0; }
  .tile { width: 8vw; max-width: 11vh; min-width: 44px; aspect-ratio: 3 / 4; border-radius: 14px; border: 4px solid var(--black); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: clamp(40px, 11vh, 140px); line-height: 1; background: rgba(0,0,0,.4); color: transparent; box-shadow: 0 6px 0 var(--black); }
  .tile.on { background: var(--yellow); color: var(--deep); animation: pop .55s cubic-bezier(.2,1.4,.4,1); }
  .tile.next { border-color: var(--gold); box-shadow: 0 0 24px rgba(255,210,63,.7), 0 6px 0 var(--black); }
  @keyframes pop { from { opacity: 0; transform: scale(.5) rotate(-6deg); } to { opacity: 1; transform: none; } }

  .row { flex: 1; min-height: 0; width: 100%; display: flex; gap: 3vw; align-items: stretch; justify-content: center; }
  .playerbox { width: 38vw; display: flex; flex-direction: column; gap: 1.2vh; }
  .player { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--black); border: 4px solid var(--cream); border-radius: 14px; overflow: hidden; }
  .player iframe, .player #ytHost { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .player .ph { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 1.5vh 1.5vw; color: var(--muted); font-size: clamp(14px, 2.4vh, 28px); }
  .song { font-weight: bold; color: var(--yellow); font-size: clamp(18px, 3vh, 38px); letter-spacing: .06em; }
  button.rescue { align-self: flex-start; font: inherit; font-weight: bold; font-size: clamp(13px, 1.9vh, 22px); background: var(--black); color: var(--yellow); border: 3px solid var(--gold); border-radius: 999px; padding: .6vh 1.4vw; cursor: pointer; }

  .side { flex: 1; max-width: 46vw; display: flex; flex-direction: column; gap: 2vh; justify-content: center; }
  .status { background: rgba(0,0,0,.4); border: 3px solid var(--cream); border-radius: 18px; padding: 2.4vh 2vw; font-size: clamp(22px, 4.4vh, 56px); line-height: 1.25; text-align: center; }
  .status.sing { background: var(--yellow); color: var(--deep); border-color: var(--black); animation: beat 1s ease-in-out infinite; font-weight: bold; }
  .status.done { background: var(--black); color: var(--yellow); border-color: var(--gold); }
  @keyframes beat { 50% { transform: scale(1.03); } }
  .hintbox { min-height: 12vh; background: var(--black); color: var(--yellow); border: 3px solid var(--red); border-radius: 14px; padding: 1.6vh 1.6vw; font-size: clamp(18px, 3.2vh, 40px); line-height: 1.3; text-align: center; display: none; }
  .hintbox.on { display: block; animation: pop .4s backwards; }
  .hintbox small { display: block; color: var(--muted); font-size: .55em; letter-spacing: .14em; text-transform: uppercase; margin-bottom: .6vh; }

  .hud { position: fixed; bottom: 1vh; left: 0; right: 0; padding: 0 3vw; font-size: 12px; line-height: 1.3; text-align: center; color: var(--muted); opacity: .7; z-index: 6; }
</style>
</head>
<body>
<main>
  <div class="org">Agence Chronos</div>
  <h1>Le concert des chasseurs de démons</h1>
  <p class="sub" id="sub"></p>
  <div class="letters" id="letters"></div>
  <div class="row">
    <div class="playerbox">
      <div class="song" id="song"></div>
      <div class="player"><div id="ytHost"></div><div class="ph" id="ph"></div></div>
      <button class="rescue" id="rescue" type="button">Ouvrir sur YouTube (O)</button>
    </div>
    <div class="side">
      <div class="status" id="status"></div>
      <div class="hintbox" id="hintbox"></div>
    </div>
  </div>
</main>

<div class="hud">Espace = coupure réussie, Retour arrière = annuler, B = rejouer la coupure, P = lecture/pause, H = indice suivant (1, 2, 3, puis masqué), O = ouvrir YouTube, F = plein écran, Entrée = ouvrir la saisie du mot</div>

<script>
  // ---------------------------------------------------------------------------
  // CONFIG: to fill in by the game master. No lyrics here, only markers.
  //  - url: YouTube link of the song (watch, youtu.be or embed form)
  //  - at: cut time "m:ss" (the music pauses by itself when this time is reached)
  //  - firstWord: first word of the line to sing (shown as hint level 2)
  //  - word: expected word (shown as hint level 3)
  // 9 cuts in total (5 for the first song, 4 for the second), one per letter.
  // ---------------------------------------------------------------------------
  var CONFIG = {
    rewindSeconds: 6,
    songs: [
      { title: "Briller", url: "", cuts: [
        { at: "", firstWord: "", word: "" },
        { at: "", firstWord: "", word: "" },
        { at: "", firstWord: "", word: "" },
        { at: "", firstWord: "", word: "" },
        { at: "", firstWord: "", word: "" }
      ] },
      { title: "Ton sauveur", url: "", cuts: [
        { at: "", firstWord: "", word: "" },
        { at: "", firstWord: "", word: "" },
        { at: "", firstWord: "", word: "" },
        { at: "", firstWord: "", word: "" }
      ] }
    ]
  };

  var LETTERS = "BRILLANTE".split("");
  var CUTS = [], i, j;
  for (i = 0; i < CONFIG.songs.length; i++) {
    for (j = 0; j < CONFIG.songs[i].cuts.length; j++) {
      var c = CONFIG.songs[i].cuts[j];
      CUTS.push({ song: i, at: parseTime(c.at), firstWord: c.firstWord || "", word: c.word || "" });
    }
  }

  var $ = function (id) { return document.getElementById(id); };
  var n = 0, hint = 0, waiting = false, player = null, ready = false, loadedSong = -1, apiFailed = false;

  function parseTime(s) {
    if (s === null || s === undefined || s === "") return null;
    var p = String(s).split(":"), v = 0;
    for (var k = 0; k < p.length; k++) v = v * 60 + (parseFloat(p[k]) || 0);
    return v;
  }
  function videoId(url) {
    var m = /(?:v=|youtu\.be\/|embed\/|shorts\/)([A-Za-z0-9_-]{11})/.exec(url || "");
    return m ? m[1] : null;
  }
  function curSong() { return n < CUTS.length ? CUTS[n].song : CONFIG.songs.length - 1; }

  // ---- rendering ----
  function buildTiles() {
    var box = $("letters"); box.innerHTML = "";
    for (var k = 0; k < LETTERS.length; k++) {
      var d = document.createElement("div"); d.className = "tile"; d.id = "t" + k; d.textContent = LETTERS[k]; box.appendChild(d);
    }
  }
  function render(animateLast) {
    for (var k = 0; k < LETTERS.length; k++) {
      var t = $("t" + k);
      t.className = "tile" + (k < n ? " on" : "") + (k === n ? " next" : "");
      if (k < n && !(animateLast && k === n - 1)) t.style.animation = "none"; else t.style.animation = "";
    }
    var s = CONFIG.songs[curSong()];
    $("song").textContent = "Chanson : " + s.title;
    $("sub").textContent = n >= LETTERS.length ? "Toutes les lettres sont revenues." : "Chaque phrase bien chantée fait revenir une lettre. Coupure " + (n + 1) + " sur " + LETTERS.length + ".";
    var st = $("status");
    if (n >= LETTERS.length) { st.className = "status done"; st.textContent = "Le mot est complet. Lisez-le ensemble, puis tapez-le à l'écran."; }
    else if (waiting) { st.className = "status sing"; st.textContent = "La musique s'arrête. À vous de chanter la suite !"; }
    else { st.className = "status"; st.textContent = ready || !videoId(s.url) ? "Écoutez bien. La musique va s'arrêter, et ce sera votre tour." : "Chargement du lecteur..."; }
    renderHint();
    renderPlayerNote();
  }
  function renderHint() {
    var hb = $("hintbox");
    if (!hint || n >= LETTERS.length) { hb.className = "hintbox"; return; }
    var cut = CUTS[n], txt = "", lab = "Indice " + hint + " sur 3";
    if (hint === 1) txt = "Coup de pouce : fredonnez ensemble.";
    else if (hint === 2) txt = "Piste : la ligne commence par « " + (cut.firstWord || "(mot à renseigner dans CONFIG)") + " ».";
    else txt = "Solution : le mot attendu est « " + (cut.word || "(mot à renseigner dans CONFIG)") + " ». Le maître du jeu chante avec vous.";
    hb.className = "hintbox on";
    hb.innerHTML = "<small>" + lab + "</small>";
    var sp = document.createElement("span"); sp.textContent = txt; hb.appendChild(sp);
  }
  function renderPlayerNote() {
    var s = CONFIG.songs[curSong()], ph = $("ph");
    if (!videoId(s.url)) { ph.style.display = "flex"; ph.textContent = "Lien YouTube à renseigner dans CONFIG (haut du script)."; }
    else if (apiFailed) { ph.style.display = "flex"; ph.textContent = "Pas de connexion au lecteur. Utiliser le bouton « Ouvrir sur YouTube » et valider les coupures à la main."; }
    else if (ready) { ph.style.display = "none"; }
    else { ph.style.display = "flex"; ph.textContent = "Chargement du lecteur..."; }
  }

  // ---- YouTube player ----
  function loadApi() {
    var any = false;
    for (var k = 0; k < CONFIG.songs.length; k++) if (videoId(CONFIG.songs[k].url)) any = true;
    if (!any) return;
    if (window.YT && window.YT.Player) { onYouTubeIframeAPIReady(); return; }
    var sc = document.createElement("script");
    sc.src = "https://www.youtube.com/iframe_api";
    sc.onerror = function () { apiFailed = true; render(); };
    document.head.appendChild(sc);
    setTimeout(function () { if (!ready) { apiFailed = true; render(); } }, 8000);
  }
  window.onYouTubeIframeAPIReady = function () {
    var s = CONFIG.songs[curSong()], id = videoId(s.url);
    if (!id) return;
    loadedSong = curSong();
    player = new YT.Player("ytHost", {
      videoId: id, width: "100%", height: "100%",
      playerVars: { rel: 0, playsinline: 1, modestbranding: 1 },
      events: { onReady: function () { ready = true; apiFailed = false; render(); }, onError: function () { apiFailed = true; render(); } }
    });
  };
  function loadSong(si) {
    if (!player || !ready) return;
    var id = videoId(CONFIG.songs[si].url);
    if (id && si !== loadedSong) { player.cueVideoById(id); loadedSong = si; }
  }
  function isPlaying() { try { return player && ready && player.getPlayerState() === 1; } catch (e) { return false; } }
  function play() { try { if (player && ready) player.playVideo(); } catch (e) {} }
  function pause() { try { if (player && ready) player.pauseVideo(); } catch (e) {} }

  setInterval(function () {
    if (!ready || waiting || n >= CUTS.length) return;
    var cut = CUTS[n];
    if (cut.at === null || cut.song !== loadedSong || !isPlaying()) return;
    var t = 0; try { t = player.getCurrentTime(); } catch (e) { return; }
    if (t >= cut.at) { pause(); waiting = true; render(); beep(); }
  }, 200);

  // ---- actions ----
  function validate() {
    if (n >= LETTERS.length) return;
    n++; waiting = false; hint = 0;
    if (n < CUTS.length) {
      if (CUTS[n].song === loadedSong) play(); else loadSong(CUTS[n].song);
    }
    render(true); ding();
  }
  function undo() {
    if (n <= 0) return;
    n--; waiting = false; hint = 0; loadSong(curSong()); render();
  }
  function replay() {
    if (n >= CUTS.length) return;
    var cut = CUTS[n];
    try { if (player && ready && cut.at !== null) player.seekTo(Math.max(0, cut.at - CONFIG.rewindSeconds), true); } catch (e) {}
    waiting = false; play(); render();
  }
  function togglePlay() {
    waiting = false;
    if (isPlaying()) pause(); else play();
    render();
  }
  function openTab() {
    var u = CONFIG.songs[curSong()].url;
    if (u) window.open(u, "_blank");
  }
  $("rescue").addEventListener("click", openTab);

  // ---- sounds (optional, silent if audio is blocked) ----
  var ac = null;
  function tone(freq, dur, delay) {
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)();
      var o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + (delay || 0);
      o.type = "triangle"; o.frequency.value = freq; g.gain.setValueAtTime(.0001, t0); g.gain.exponentialRampToValueAtTime(.25, t0 + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(ac.destination); o.start(t0); o.stop(t0 + dur + .05);
    } catch (e) {}
  }
  function ding() { tone(660, .25, 0); tone(990, .4, .12); }
  function beep() { tone(440, .3, 0); }

  document.addEventListener("keydown", function (e) {
    var k = e.key;
    if (e.code === "Space" || k === "ArrowRight") { e.preventDefault(); validate(); }
    else if (k === "Backspace" || k === "ArrowLeft") { e.preventDefault(); undo(); }
    else if (k === "Enter" && window.parent !== window) { window.parent.postMessage({ type: "next" }, "*"); }
    else if (k === "b" || k === "B") { replay(); }
    else if (k === "p" || k === "P") { togglePlay(); }
    else if (k === "h" || k === "H") { hint = (hint + 1) % 4; renderHint(); }
    else if (k === "o" || k === "O") { openTab(); }
    else if (k === "f" || k === "F") { try { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); } catch (x) {} }
  });

  // kpop.html#N = N letters already revealed; kpop.html#NhM = also hint level M (testing)
  var hm = /^#(\d+)(?:h(\d))?/.exec(location.hash);
  if (hm) { n = Math.min(LETTERS.length, parseInt(hm[1], 10)); hint = hm[2] ? Math.min(3, parseInt(hm[2], 10)) : 0; }
  buildTiles(); render(); loadApi();
</script>
</body>
</html>
