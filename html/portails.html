<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Les cinq portails</title>
<style>
  :root {
    --deep: #2a0508; --violet: #9c1020; --black: #111111;
    --yellow: #ffe14d; --cream: #fff1d6; --muted: #ffd6d6; --red: #e8142b; --gold: #ffd23f;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: linear-gradient(135deg, var(--deep) 0%, var(--violet) 55%, #d4182b 100%);
    color: #fff; font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif; overflow: hidden;
  }
  body::after { content: ""; position: fixed; inset: 0; pointer-events: none; background: repeating-linear-gradient(0deg, rgba(0,0,0,.08) 0 2px, transparent 2px 4px); }
  .view { position: absolute; inset: 0; padding: 5vh 5vw; display: none; align-items: center; justify-content: center; text-align: center; z-index: 1; }
  .view.active { display: flex; animation: pop .6s cubic-bezier(.2,1.4,.4,1); }
  @keyframes pop { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
  .fit { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; transform-origin: center center; }

  .org { background: var(--black); color: var(--yellow); font-weight: bold; letter-spacing: .25em; text-transform: uppercase; font-size: clamp(14px, 2.2vh, 28px); padding: .6vh 1.6vw; border-radius: 999px; margin-bottom: 3vh; box-shadow: 0 0 20px rgba(255,210,63,.6); }
  h1 { margin: 0 0 2vh; font-size: clamp(40px, 9vh, 120px); line-height: 1.05; text-shadow: 4px 4px 0 var(--black); }
  h2 { margin: 0 0 3vh; font-size: clamp(32px, 6vh, 80px); color: var(--yellow); text-shadow: 3px 3px 0 rgba(0,0,0,.35); }
  .sub { font-size: clamp(20px, 3.4vh, 44px); color: var(--muted); margin: 0 0 3vh; }

  /* overview */
  .grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1.6vw; width: 100%; }
  .card { background: rgba(255,255,255,.12); border: 3px solid var(--cream); border-radius: 16px; padding: 1.4vh .8vw 2.4vh; position: relative; }
  .card .art { width: 100%; aspect-ratio: 4 / 3; border-radius: 10px; overflow: hidden; margin-bottom: 1.2vh; background: rgba(0,0,0,.35); border: 2px dashed var(--cream); display: flex; align-items: center; justify-content: center; font-size: clamp(40px, 12vh, 150px); font-weight: bold; color: var(--yellow); }
  .card.open .art { border: none; }
  .card .art svg, .card .art img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .card .num { font-size: clamp(22px, 4.4vh, 60px); color: var(--yellow); font-weight: bold; line-height: 1; }
  .card .name { font-size: clamp(18px, 3.2vh, 40px); margin-top: 1vh; min-height: 2.4em; }
  .card.locked { opacity: .85; }
  .gem { display: none; position: absolute; top: -2vh; right: -1vw; width: clamp(40px, 8vh, 90px); height: clamp(40px, 8vh, 90px); }
  .card.earned .gem { display: block; animation: pop .6s ease; }
  .card.earned { border-color: var(--gold); box-shadow: 0 0 30px rgba(255,210,63,.6); }

  /* reveal */
  .reveal-art { width: min(60vw, 80vh); aspect-ratio: 4 / 3; border-radius: 18px; overflow: hidden; border: 4px solid var(--cream); box-shadow: 0 0 40px rgba(255,241,214,.4); margin-bottom: 3vh; }
  .reveal-art svg, .reveal-art img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .room { display: inline-block; background: var(--yellow); color: var(--deep); font-weight: bold; border-radius: 12px; padding: 1vh 2vw; font-size: clamp(22px, 4vh, 52px); }
  .era { color: var(--muted); font-size: clamp(20px, 3.4vh, 44px); margin: 0 0 3vh; }

  .hud { position: fixed; bottom: 2vh; left: 0; right: 0; padding: 0 3vw; font-size: 13px; color: var(--muted); opacity: .6; z-index: 2; }
</style>
</head>
<body>

<section class="view active" id="overview">
  <div class="fit">
    <div class="org">Agence Chronos</div>
    <h1>Les cinq portails</h1>
    <p class="sub" id="overviewSub">Un portail s'ouvre. Où mène-t-il ?</p>
    <div class="grid" id="grid"></div>
  </div>
</section>

<section class="view" id="reveal">
  <div class="fit">
    <div class="org" id="revealOrg"></div>
    <div class="reveal-art" id="revealArt"></div>
    <h1 id="revealName"></h1>
    <p class="era" id="revealEra"></p>
    <div class="room" id="revealRoom"></div>
  </div>
</section>

<div class="hud">Maître du jeu : 1 à 5 ou Espace = ouvrir un portail, Entrée = mot rapporté (retour à la vue d'ensemble), Échap = retour, Maj + R = tout remettre à zéro, F = plein écran, M = couper le son du saut temporel</div>

<script src="univers-data.js"></script>
<script src="vortex.js"></script>
<script>
  var N = UNIVERS.length;
  var state = { opened: [], earned: [] };
  var KEY = "escape.portails";
  var current = null; // index of the universe being shown, or null for overview

  try { var saved = JSON.parse(localStorage.getItem(KEY) || "null"); if (saved && saved.opened) state = saved; } catch (e) {}
  for (var k = 0; k < N; k++) { state.opened[k] = !!state.opened[k]; state.earned[k] = !!state.earned[k]; }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  var GEM = '<svg class="gem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><polygon points="50,4 90,34 74,92 26,92 10,34" fill="#ffd23f" stroke="#fff1d6" stroke-width="4"/><polygon points="50,4 62,34 38,34" fill="#fff6c9"/><polygon points="10,34 38,34 26,92" fill="#e0a800"/></svg>';

  // Illustration: the drawing, replaced by images/univers-N.jpg if that file exists.
  function setArt(container, i) {
    container.innerHTML = UNIVERS_ART[i] || "";
    var img = new Image();
    img.onload = function () { container.innerHTML = ""; container.appendChild(img); };
    img.src = "../images/univers-" + (i + 1) + ".jpg";
  }

  function fit(view) {
    var f = view.querySelector(".fit");
    f.style.transform = "none";
    var cs = getComputedStyle(view);
    var availH = view.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var need = f.scrollHeight;
    f.style.transform = need > availH ? "scale(" + (availH / need).toFixed(3) + ")" : "none";
  }

  var grid = document.getElementById("grid");
  function renderOverview() {
    grid.innerHTML = "";
    for (var i = 0; i < N; i++) {
      var c = document.createElement("div");
      c.className = "card " + (state.opened[i] ? "open" : "locked") + (state.earned[i] ? " earned" : "");
      c.innerHTML = '<div class="art"></div><div class="num"></div><div class="name"></div>' + GEM;
      c.querySelector(".num").textContent = "Portail " + (i + 1);
      c.querySelector(".name").textContent = state.opened[i] ? UNIVERS[i].name : "Destination inconnue";
      var art = c.querySelector(".art");
      if (state.opened[i]) setArt(art, i); else art.textContent = "?";
      grid.appendChild(c);
    }
    var done = state.earned.filter(Boolean).length;
    document.getElementById("overviewSub").textContent =
      done === N ? "Les cinq mots sont rapportés. Chaque monde est à sa place." : done + " mot" + (done > 1 ? "s rapportés" : " rapporté") + " sur " + N + ". Un portail s'ouvre. Où mène-t-il ?";
  }

  function show(viewId) {
    var views = document.querySelectorAll(".view");
    for (var v = 0; v < views.length; v++) views[v].classList.toggle("active", views[v].id === viewId);
    fit(document.getElementById(viewId));
  }

  function showOverview() { current = null; renderOverview(); show("overview"); }

  // Time jump: vortex animation, the content is swapped at its peak.
  function jump(swap) {
    if (Vortex.isRunning()) return;
    Vortex.play({ duration: 2600, onMid: swap });
  }

  function openPortal(i, instant) {
    if (i < 0 || i >= N) return;
    if (instant) { doOpen(i); return; }
    jump(function () { doOpen(i); });
  }

  function doOpen(i) {
    current = i;
    state.opened[i] = true; save();
    var u = UNIVERS[i];
    document.getElementById("revealOrg").textContent = "Portail " + (i + 1);
    setArt(document.getElementById("revealArt"), i);
    document.getElementById("revealName").textContent = u.name;
    document.getElementById("revealEra").textContent = u.era;
    document.getElementById("revealRoom").textContent = "Rendez-vous : " + u.room;
    show("reveal");
  }

  function openNext() {
    for (var i = 0; i < N; i++) { if (!state.opened[i]) { openPortal(i); return; } }
    showOverview();
  }

  document.addEventListener("keydown", function (e) {
    if (e.key >= "1" && e.key <= "5") { openPortal(parseInt(e.key, 10) - 1); }
    else if (e.code === "Space" || e.key === "ArrowRight") { e.preventDefault(); if (current === null) openNext(); else showOverview(); }
    else if (e.key === "Escape" || e.key === "ArrowLeft") { showOverview(); }
    else if (e.key === "Enter") { if (current !== null) { jump(function () { state.earned[current] = true; save(); showOverview(); }); } else showOverview(); }
    else if (e.key === "m" || e.key === "M") { Vortex.muted = !Vortex.muted; }
    else if (e.key === "R" && e.shiftKey) { state = { opened: [], earned: [] }; for (var j = 0; j < N; j++) { state.opened[j] = false; state.earned[j] = false; } save(); showOverview(); }
    else if (e.key === "f" || e.key === "F") { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }
  });
  window.addEventListener("resize", function () { fit(document.querySelector(".view.active")); });

  // Optional deep link: portails.html#3 opens portal 3 (useful for testing).
  var h = parseInt(location.hash.slice(1), 10);
  if (h >= 1 && h <= N) openPortal(h - 1, true); else showOverview();
</script>
</body>
</html>
